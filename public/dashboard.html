<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Click Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: #1a1d27;
      border-bottom: 1px solid #2d3148;
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 18px; font-weight: 600; color: #fff; }

    .refresh-btn {
      background: #3b5bdb;
      color: #fff;
      border: none;
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }
    .refresh-btn:hover { background: #4c6ef5; }

    .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    /* Stat Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 20px 24px;
    }

    .stat-card .label {
      font-size: 12px;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .stat-card .value {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
    }

    .stat-card .value.green { color: #51cf66; }
    .stat-card .value.blue  { color: #4dabf7; }

    /* Sections */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .section {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 10px;
      overflow: hidden;
    }

    .section-header {
      padding: 14px 20px;
      border-bottom: 1px solid #2d3148;
      font-size: 13px;
      font-weight: 600;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    table { width: 100%; border-collapse: collapse; }

    th {
      padding: 10px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: #8892a4;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid #2d3148;
    }

    td {
      padding: 10px 16px;
      font-size: 13px;
      border-bottom: 1px solid #1e2235;
      color: #cbd5e0;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #202436; }

    .badge {
      display: inline-block;
      background: #2d3748;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 600;
      color: #90cdf4;
    }

    .url-cell {
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #a0aec0;
      font-size: 12px;
    }

    .origin-chip {
      background: #1e3a5f;
      color: #63b3ed;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .bar-wrap { padding: 4px 0; }
    .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .bar-label { font-size: 12px; color: #a0aec0; width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { flex: 1; background: #2d3148; border-radius: 4px; height: 8px; }
    .bar-fill { height: 8px; border-radius: 4px; background: #3b5bdb; transition: width 0.4s; }
    .bar-count { font-size: 12px; color: #fff; font-weight: 600; min-width: 32px; text-align: right; }

    .loading { text-align: center; padding: 48px; color: #8892a4; font-size: 14px; }

    .time-cell { font-size: 11px; color: #8892a4; white-space: nowrap; }

    .full-section { margin-bottom: 24px; }
  </style>
</head>
<body>

<header>
  <h1>Click Dashboard</h1>
  <button class="refresh-btn" onclick="loadStats()">Refresh</button>
</header>

<div class="container">

  <div class="stats-grid" id="statsGrid">
    <div class="loading">Loading...</div>
  </div>

  <div class="grid-2">
    <div class="section">
      <div class="section-header">Clicks by Site</div>
      <div id="bySiteChart" style="padding:16px 20px;">
        <div class="loading">Loading...</div>
      </div>
    </div>

    <div class="section">
      <div class="section-header">Top Pages</div>
      <div style="overflow-x:auto;">
        <table>
          <thead>
            <tr><th>Page URL</th><th>Site</th><th>Clicks</th></tr>
          </thead>
          <tbody id="byPageTable"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="section full-section">
    <div class="section-header">Recent Clicks</div>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr><th>Time</th><th>Site</th><th>Page URL</th><th>Referrer</th></tr>
        </thead>
        <tbody id="recentTable"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
  async function loadStats() {
    try {
      const res = await fetch('/api/dashboard-stats');
      const data = await res.json();
      if (!data.success) return;

      renderStatCards(data);
      renderBySite(data.bySite);
      renderByPage(data.byPage);
      renderRecent(data.recent);
    } catch (e) {
      document.getElementById('statsGrid').innerHTML =
        '<div class="loading">Failed to load data. Is server running?</div>';
    }
  }

  function renderStatCards(data) {
    document.getElementById('statsGrid').innerHTML = `
      <div class="stat-card">
        <div class="label">Total Clicks</div>
        <div class="value">${data.totalClicks.toLocaleString()}</div>
      </div>
      <div class="stat-card">
        <div class="label">Today's Clicks</div>
        <div class="value green">${data.todayClicks.toLocaleString()}</div>
      </div>
      <div class="stat-card">
        <div class="label">Active Sites</div>
        <div class="value blue">${data.bySite.length}</div>
      </div>
      <div class="stat-card">
        <div class="label">Unique Pages</div>
        <div class="value">${data.byPage.length}</div>
      </div>
    `;
  }

  function renderBySite(bySite) {
    if (!bySite.length) {
      document.getElementById('bySiteChart').innerHTML = '<div class="loading">No data yet</div>';
      return;
    }
    const max = bySite[0].count;
    document.getElementById('bySiteChart').innerHTML = bySite.map(s => `
      <div class="bar-row">
        <div class="bar-label" title="${s._id}">${s._id || 'unknown'}</div>
        <div class="bar-track">
          <div class="bar-fill" style="width:${Math.round((s.count/max)*100)}%"></div>
        </div>
        <div class="bar-count">${s.count}</div>
      </div>
    `).join('');
  }

  function renderByPage(byPage) {
    if (!byPage.length) {
      document.getElementById('byPageTable').innerHTML =
        '<tr><td colspan="3" class="loading">No data yet</td></tr>';
      return;
    }
    document.getElementById('byPageTable').innerHTML = byPage.map(p => `
      <tr>
        <td><div class="url-cell" title="${p._id}">${p._id}</div></td>
        <td><span class="origin-chip">${p.origin || '-'}</span></td>
        <td><span class="badge">${p.count}</span></td>
      </tr>
    `).join('');
  }

  function renderRecent(recent) {
    if (!recent.length) {
      document.getElementById('recentTable').innerHTML =
        '<tr><td colspan="4" class="loading">No clicks recorded yet</td></tr>';
      return;
    }
    document.getElementById('recentTable').innerHTML = recent.map(r => `
      <tr>
        <td class="time-cell">${formatTime(r.timestamp)}</td>
        <td><span class="origin-chip">${r.origin || '-'}</span></td>
        <td><div class="url-cell" title="${r.url}">${r.url}</div></td>
        <td><div class="url-cell" title="${r.referrer}">${r.referrer || '-'}</div></td>
      </tr>
    `).join('');
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return d.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata' }) + ' ' +
           d.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit' });
  }

  loadStats();
  setInterval(loadStats, 30000);
</script>

</body>
</html>
